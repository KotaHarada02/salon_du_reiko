name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next.config.mjs はビルド時の型エラーを無視するため、ここで型を検査する
      - name: Typecheck
        run: npm run typecheck

      - name: Build (static export)
        run: npm run build

      - name: Check exported pages
        run: test -f out/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
